# Single-package repo. pnpm still requires `packages` whenever this file
# exists — without it every `pnpm install` / `pnpm run` fails with
# ERR_PNPM_INVALID_WORKSPACE_CONFIGURATION.
packages:
  - .

# pnpm 10+ blocks dependency build scripts until they are approved. These
# three ship prebuilt binaries and need their install scripts to run.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
